<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeuraChat AI - Chat</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="chat-container">


    <!-- =========================
         CHAT HEADER
    ========================== -->

    <div class="chat-header">

        <h1>🤖 NeuraChat AI</h1>

        <p class="status">🟢 Online</p>


        <div class="chat-controls">

            <button id="newChatBtn"
                    title="New Chat">
                ➕
            </button>

            <button id="clearBtn"
                    title="Clear Chat">
                🗑️
            </button>

            <button id="voiceBtn"
                    title="Voice On">
                🔊
            </button>

        </div>

    </div>



    <!-- =========================
         CHAT BOX
    ========================== -->

    <div id="chatBox">

        <div class="message-row bot-row">

            <div class="message bot-message">

                <div class="message-name">
                    🤖 NeuraChat AI
                </div>

                <div class="message-text">
                    Hello! How can I help you? 😊
                </div>

                <small>
                    Just now
                </small>

            </div>

        </div>

    </div>



    <!-- =========================
         INPUT AREA
    ========================== -->

    <div class="input-area">

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            autocomplete="off"
        >


        <button
            id="micBtn"
            title="Speak"
        >
            🎤
        </button>


        <button
            id="sendBtn"
        >
            Send
        </button>

    </div>


</div>



<script src="{{ url_for('static', filename='js/chat.js') }}"></script>


<script>
    console.log("NeuraChat AI chat.js loaded successfully");
</script>


</body>

</html>
