<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeuraChat AI - Chat</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="chat-container">


    <!-- =========================
         CHAT HEADER
    ========================== -->

    <div class="chat-header">

        <h1>🤖 NeuraChat AI</h1>

        <p class="status">
            🟢 Online
        </p>


        <div class="chat-controls">


            <!-- EXAM MODE -->

            <button
                id="examModeBtn"
                title="Exam Mode"
                type="button">
                📝
            </button>


            <!-- NEW CHAT -->

            <button
                id="newChatBtn"
                title="New Chat"
                type="button">
                ➕
            </button>


            <!-- CLEAR -->

            <button
                id="clearBtn"
                title="Clear Chat"
                type="button">
                🗑️
            </button>


            <!-- VOICE -->

            <button
                id="voiceBtn"
                title="Voice On"
                type="button">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         EXAM PANEL
    ========================== -->

    <div
        id="examPanel"
        style="
            display:none;
            padding:15px;
            margin:10px;
            border-radius:12px;
            background:#f3f4f6;
        ">


        <h3>
            📝 Exam Mode
        </h3>


        <input
            type="text"
            id="examTopic"
            placeholder="Enter subject/topic e.g. Java"
            autocomplete="off"
            style="
                width:70%;
                padding:10px;
                border-radius:8px;
                border:1px solid #ccc;
            "
        >


        <input
            type="number"
            id="examQuestions"
            value="5"
            min="1"
            max="20"
            style="
                width:70px;
                padding:10px;
                border-radius:8px;
                border:1px solid #ccc;
            "
        >


        <button
            id="startExamBtn"
            type="button">
            Start Exam
        </button>


        <button
            id="endExamBtn"
            type="button"
            style="display:none;">
            End Exam
        </button>


    </div>


    <!-- =========================
         EXAM STATUS
    ========================== -->

    <div
        id="examStatus"
        style="
            display:none;
            padding:8px 15px;
            font-weight:bold;
        ">
    </div>


    <!-- =========================
         CHAT BOX
    ========================== -->

    <div id="chatBox">

        <div class="message-row bot-row">

            <div class="message bot-message">

                <div class="message-name">
                    🤖 NeuraChat AI
                </div>

                <div class="message-text">
                    Hello! How can I help you? 😊
                </div>

                <small>
                    Just now
                </small>

            </div>

        </div>

    </div>


    <!-- =========================
         IMAGE PREVIEW
    ========================== -->

    <div
        id="imagePreviewContainer"
        style="display:none;">

        <img
            id="imagePreview"
            src=""
            alt="Selected Image"
        >


        <button
            id="removeImageBtn"
            type="button"
            title="Remove Image">
            ❌
        </button>

    </div>


    <!-- =========================
         INPUT AREA
    ========================== -->

    <div class="input-area">


        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >


        <button
            id="uploadBtn"
            title="Upload Image"
            type="button">
            🖼️
        </button>


        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            autocomplete="off"
        >


        <button
            id="micBtn"
            title="Speak"
            type="button">
            🎤
        </button>


        <button
            id="sendBtn"
            type="button">
            Send
        </button>

    </div>


</div>


<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>

</html>
