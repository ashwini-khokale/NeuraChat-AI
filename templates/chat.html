<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeuraChat AI - Chat</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body>

<div class="chat-container">


    <!-- =========================
         CHAT HEADER
    ========================== -->

    <div class="chat-header">

        <h1>🤖 NeuraChat AI</h1>

        <p class="status">
            🟢 Online
        </p>


        <div class="chat-controls">

            <button
                id="newChatBtn"
                title="New Chat"
                type="button">
                ➕
            </button>


            <button
                id="clearBtn"
                title="Clear Chat"
                type="button">
                🗑️
            </button>


            <button
                id="voiceBtn"
                title="Voice On"
                type="button">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         CHAT BOX
    ========================== -->

    <div id="chatBox">

        <div class="message-row bot-row">

            <div class="message bot-message">

                <div class="message-name">
                    🤖 NeuraChat AI
                </div>


                <div class="message-text">
                    Hello! How can I help you? 😊
                </div>


                <small>
                    Just now
                </small>

            </div>

        </div>

    </div>



    <!-- =========================
         IMAGE PREVIEW
    ========================== -->

    <div id="imagePreviewContainer"
         style="display: none;">

        <img
            id="imagePreview"
            src=""
            alt="Selected Image"
            style="
                max-width: 180px;
                max-height: 180px;
                border-radius: 10px;
                margin: 10px;
            "
        >

        <button
            id="removeImageBtn"
            type="button"
            title="Remove Image">
            ❌
        </button>

    </div>



    <!-- =========================
         INPUT AREA
    ========================== -->

    <div class="input-area">


        <!-- Hidden Image Input -->

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
        >


        <!-- Image Upload Button -->

        <button
            id="uploadBtn"
            title="Upload Image"
            type="button">

            🖼️

        </button>


        <!-- Text Input -->

        <input
            type="text"
            id="userInput"
            placeholder="Type your message..."
            autocomplete="off"
        >


        <!-- Microphone -->

        <button
            id="micBtn"
            title="Speak"
            type="button">

            🎤

        </button>


        <!-- Send -->

        <button
            id="sendBtn"
            type="button">

            Send

        </button>


    </div>


</div>



<!-- =========================
     CHAT JAVASCRIPT
========================== -->

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>



<script>

    console.log(
        "NeuraChat AI chat.js loaded successfully"
    );


    // =========================
    // IMAGE UPLOAD
    // =========================

    const uploadBtn =
        document.getElementById("uploadBtn");

    const imageInput =
        document.getElementById("imageInput");

    const imagePreviewContainer =
        document.getElementById(
            "imagePreviewContainer"
        );

    const imagePreview =
        document.getElementById(
            "imagePreview"
        );

    const removeImageBtn =
        document.getElementById(
            "removeImageBtn"
        );


    // Open file selector

    uploadBtn.addEventListener(
        "click",
        function () {

            imageInput.click();

        }
    );


    // Show selected image

    imageInput.addEventListener(
        "change",
        function () {

            const file =
                imageInput.files[0];


            if (!file) {
                return;
            }


            // Check image type

            if (!file.type.startsWith("image/")) {

                alert(
                    "Please select an image file."
                );

                imageInput.value = "";

                return;
            }


            // Create preview

            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    imagePreview.src =
                        event.target.result;

                    imagePreviewContainer.style.display =
                        "flex";

                };


            reader.readAsDataURL(file);

        }
    );


    // Remove selected image

    removeImageBtn.addEventListener(
        "click",
        function () {

            imageInput.value = "";

            imagePreview.src = "";

            imagePreviewContainer.style.display =
                "none";

        }
    );

</script>


</body>

</html>
