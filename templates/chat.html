<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NeuraChat AI - Chat</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="chat-container">


    <!-- =========================
         CHAT HEADER
    ========================== -->

    <div class="chat-header">

        <h1>🤖 NeuraChat AI</h1>

        <p class="status">
            🟢 Online
        </p>

        <div class="chat-controls">

            <button id="newChatBtn"
                    title="New Chat"
                    type="button">
                ➕
            </button>

            <button id="clearBtn"
                    title="Clear Chat"
                    type="button">
                🗑️
            </button>

            <button id="voiceBtn"
                    title="Voice On"
                    type="button">
                🔊
            </button>

        </div>

    </div>


    <!-- =========================
         CHAT BOX
    ========================== -->

    <div id="chatBox">

        <div class="message-row bot-row">

            <div class="message bot-message">

                <div class="message-name">
                    🤖 NeuraChat AI
                </div>

                <div class="message-text">
                    Hello! How can I help you? 😊
                </div>

                <small>
                    Just now
                </small>

            </div>

        </div>

    </div>


    <!-- =========================
         FILE PREVIEW
    ========================== -->

    <div id="filePreviewContainer"
         class="file-preview-container"
         style="display:none;">

        <div id="filePreviewIcon"
             class="file-preview-icon">
            📄
        </div>

        <div id="filePreviewName"
             class="file-preview-name">
            File
        </div>

        <button id="removeFileBtn"
                type="button"
                title="Remove File">
            ❌
        </button>

    </div>


    <!-- =========================
         IMAGE PREVIEW
    ========================== -->

    <div id="imagePreviewContainer"
         class="image-preview-container"
         style="display:none;">

        <img id="imagePreview"
             src=""
             alt="Selected Image">

        <button id="removeImageBtn"
                type="button"
                title="Remove Image">
            ❌
        </button>

    </div>


    <!-- =========================
         EMOJI PICKER
    ========================== -->

    <div id="emojiPicker"
         class="emoji-picker">


        <!-- SEARCH -->

        <div class="emoji-search-box">

            <input type="text"
                   id="emojiSearch"
                   placeholder="🔍 Search emoji...">

        </div>


        <!-- CATEGORIES -->

        <div class="emoji-categories">

            <button type="button"
                    class="emoji-category active"
                    data-category="smileys">
                😀
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="people">
                👋
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="animals">
                🐶
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="food">
                🍕
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="activities">
                ⚽
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="travel">
                🚗
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="objects">
                💡
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="symbols">
                ❤️
            </button>

            <button type="button"
                    class="emoji-category"
                    data-category="flags">
                🇮🇳
            </button>

        </div>


        <!-- EMOJI LIST -->

        <div id="emojiList"
             class="emoji-list">
        </div>

    </div>


    <!-- =========================
         INPUT AREA
    ========================== -->

    <div class="input-area">


        <!-- IMAGE INPUT -->

        <input type="file"
               id="imageInput"
               accept="image/*"
               hidden>


        <!-- PDF INPUT -->

        <input type="file"
               id="pdfInput"
               accept=".pdf,application/pdf"
               hidden>


        <!-- IMAGE BUTTON -->

        <button id="uploadBtn"
                title="Upload Image"
                type="button">
            🖼️
        </button>


        <!-- PDF BUTTON -->

        <button id="pdfBtn"
                title="Upload PDF"
                type="button">
            📄
        </button>


        <!-- EMOJI -->

        <button id="emojiBtn"
                title="Emoji"
                type="button">
            😊
        </button>


        <!-- TEXT -->

        <input type="text"
               id="userInput"
               placeholder="Type your message..."
               autocomplete="off">


        <!-- MICROPHONE -->

        <button id="micBtn"
                title="Speak"
                type="button">
            🎤
        </button>


        <!-- SEND -->

        <button id="sendBtn"
                type="button">
            Send
        </button>

    </div>

</div>


<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>

</html>
